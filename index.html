<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> ♡Nuestro comienzo♡ </title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/minijuegos.css">

</head>

<body>


<div class="contenedor">

    <div class="portada">

        <div class="portada-etiqueta">
            ✦ MAGGIE × RULITOS ✦
        </div>

        <h1 class="portada-titulo">
            Vos y yo
        </h1>

        <div class="subtitulo portada-subtitulo">
            Una historia que comenzó con una apuesta...
            <br><br>
            Y terminó convirtiéndose
            en nuestro pequeño universo. ♡
        </div>

        <div class="portada-escena">

            <span class="portada-corazon corazon-uno">♡</span>
            <span class="portada-corazon corazon-dos">♥</span>
            <span class="portada-corazon corazon-tres">♡</span>

            <div class="portada-personaje portada-rulings">
                <img
                    src="img/personajes/rulings.png"
                    alt="Rulings en pixel art"
                >
                <span>Rulings</span>
            </div>

            <div class="portada-centro">♡</div>

            <div class="portada-personaje portada-maggie">
                <img
                    src="img/personajes/maggie.png"
                    alt="Maggie en pixel art"
                >
                <span>Maggie</span>
            </div>

        </div>

        <button onclick="comenzar()">
            ♡ Comenzar ♡
        </button>

        <div class="pequeno portada-pie">
            Un pequeño regalo hecho con amor.
        </div>

    </div>

</div>


<script src="js/game.js"></script>
<script src="js/minijuegos.js"></script>
<script>


function comenzar() {
    if (localStorage.getItem("instruccionesVistas") === "si") {
        menuNiveles();
        return;
    }

    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">🎮</div>
        <h1>Antes de comenzar...</h1>

        <div class="subtitulo">
            Bienvenido a nuestro pequeño universo.
            <br><br>
            ♡ Cada capítulo guarda un recuerdo.
            <br><br>
            ♡ Tendrás que completar los niveles
            en orden para desbloquear los siguientes.
            <br><br>
            ♡ Algunas decisiones pondrán a prueba
            tu memoria.
            <br><br>
            ♡ Tu progreso se guardará automáticamente
            en este dispositivo y navegador.
            <br><br>
            Y lo más importante...
            disfrutá de nuestra historia. ♡
        </div>

        <button onclick="terminarInstrucciones()">
            Entendido, ¡a jugar! ♡
        </button>
    `;
}

function terminarInstrucciones() {
    localStorage.setItem("instruccionesVistas", "si");
    menuNiveles();
}


function menuNiveles() {
    let nivel = Number(localStorage.getItem("nivelDesbloqueado") || 1);
    nivel = Math.min(4, Math.max(1, nivel));

    function boton(numero, nombre, funcion) {
        if (nivel >= numero) {
            return `
                <button onclick="${funcion}()">
                    ♡ 0${numero} — ${nombre}
                </button>
            `;
        }

        return `
            <button disabled style="
                opacity: 0.35;
                cursor: not-allowed;
                border-color: #765665;
            ">
                🔒 0${numero} — ${nombre}
            </button>
        `;
    }

    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">🌙</div>
        <h1>Nuestro universo</h1>

        <div class="subtitulo">
            Cada recuerdo guarda una parte
            de nuestra historia.
            <br><br>
            Completá los capítulos para
            descubrir lo que viene después.
        </div>

        <div class="opciones">
            ${boton(1, "El comienzo", "pregunta1")}
            ${boton(2, "Nuestra apuesta", "capitulo02")}
            ${boton(3, "Siete meses", "capitulo03")}
            ${boton(4, "Una carta para vos", "capitulo04")}
        </div>

        <div class="pequeno">
            Progreso: ${nivel} de 4 capítulos disponibles ♡
        </div>

<button onclick="reiniciarJuego()"
    style="margin-top:20px; font-size:12px; opacity:0.5;">
    Reiniciar progreso
</button>
    `;
}

function desbloquearNivel(numero) {
    let actual = Number(localStorage.getItem("nivelDesbloqueado") || 1);

    if (numero > actual) {
        localStorage.setItem("nivelDesbloqueado", String(numero));
    }
}


function pregunta1() {

    Juego.mostrar(`

        <div class="corazon">💭</div>

        <h1>El comienzo</h1>

        <div class="subtitulo">

            Cuando nos conocimos...

            <br><br>

            <strong>
            ¿Qué fue lo primero que pensaste de mí?
            </strong>

        </div>

        <div class="opciones">

            <button onclick="respuesta('A')">
                "Me llamó la atención"
            </button>

            <button onclick="respuesta('B')">
                "Me pareció interesante"
            </button>

            <button onclick="respuesta('C')">
                "No pensé demasiado"
            </button>

            <button onclick="respuesta('D')">
                "No sabía que iba a terminar así..."
            </button>

        </div>

        <div class="pequeno">
            Elegí la respuesta que más se parezca a vos 
        </div>

    `) ;

}


function respuesta(opcion) {

    let mensaje = "";

    if (opcion === "A") {

        mensaje = `
            Entonces desde el principio hubo química... 
        `;

    }

    if (opcion === "B") {

        mensaje = `
            Capaz todavía no lo sabías,
            pero algo estaba empezado... 
        `;

    }

    if (opcion === "C") {

        mensaje = `
            Y miranos ahora...
            quién iba a imaginarlo, ¿no? 
        `;

    }

    if (opcion === "D") {

        mensaje = `
            Tal vez esa sea justamente
            la parte más linda de nuestra historia. ♡
        `;

    }


    document.querySelector(".contenedor").innerHTML = `

        <div class="corazon">♡</div>

        <h1>Tu respuesta</h1>

        <div class="subtitulo">

            ${mensaje}

            <br><br>

            <span style="opacity:0.7">
            Pero esto recién empieza...
            </span>

        </div>

        <button onclick="pregunta2()">

           ♡ Siguiente ♡

        </button>

    `;

}


function pregunta2() {

    document.querySelector(".contenedor").innerHTML = `

        <div class="corazon">🌙</div>

        <h1>01.02</h1>

        <div class="subtitulo">

            Después de conocernos... 

            <br><br>

            <strong>
            ¿En qué momento sentiste que
            empezaba a gustarte de verdad?
            </strong>

        </div>

        <div class="opciones">

            <button onclick="MemoriaNosotros.iniciar()">
                "Desde el principio."
            </button>

            <button onclick="MemoriaNosotros.iniciar()">
                "Después de hablar más."
            </button>

            <button onclick="MemoriaNosotros.iniciar()">
                "En algun momento inesperado..."
            </button>

            <button onclick="MemoriaNosotros.iniciar()">
                "Todavía estoy intentando descubrirlo..."
            </button>

        </div>

    `;

}


function finalPregunta() {

desbloquearNivel(2);
Juego.celebrar();

    document.querySelector(".contenedor").innerHTML = `

        <div class="corazon">💗</div>

        <h1>Seguimos...</h1>

        <div class="subtitulo">

            Cada respuesta nos acerca
            un poquitito más al final.

            <br><br>

            Y todavía quedan muchas
            cosas por descubrir.

        </div>

<button onclick="menuNiveles()">
    Continuar al menú ♡
</button>

    `;

}

function capitulo02() {
   Juego.mostrar(`
        <div class="corazon">🎮</div>
        <h1>La apuesta</h1>

        <div class="subtitulo">
            MISIÓN 02 · RECUERDOS
            <br><br>
            Todo comenzó en una juntada...
            <br><br>
            Hablamos un poquito y, al final,
            decidí poner a prueba
            tu memoria.
            <br><br>
            ¿Estabas preparado para ese desafío?
        </div>

        <button onclick="apuesta02()">Aceptar la misión</button>
        <div class="pequeno">Maggie × Rulitos</div>
    `);
}

function apuesta02() {
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">🍟</div>
        <h1>El trato</h1>

        <div class="subtitulo">
          Yo te dije mi nombre y después
            solte una apuesta:
            <br><br>
            <em>«Mañana ni te vas a acordar
            mi nombre».</em>
            <br><br>
            Y vos, orgulloso, aceptaste esa apuesta... 
            El premio sería un McDonald's.
            <br><br>
            Y así, quedó sellado ese trato.
        </div>

        <button onclick="prueba02()">Descubrir el resultado</button>
    `;
}

function prueba02() {
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">👀</div>
        <h1>Dos días después...</h1>

        <div class="subtitulo">
            Nos volvimos a ver y
            te pregunte mi nombre...
            <br><br>
            Y llegó el momento de demostrar
            que tenías una memoria impecable.
            <br><br>
            Bueno... impecable no tanto.
            <br><br>
            <strong>¡No te acordaste y encima
            dijiste otro nombre!</strong>
        </div>

        <div class="opciones">
            <button onclick="resultado02('A')">
                Mi memoria me abandonó 😭
            </button>

            <button onclick="resultado02('B')">
                ¡Pero pagué el McDonald's! 🍔
            </button>

            <button onclick="resultado02('C')">
                No hay defensa posible...
            </button>
        </div>
    `;
}

function resultado02(opcion) {
    let reaccion = "";

    if (opcion === "A") {
        reaccion = "JAJAJA, tu memoria decidió tomarse el día libre. 😭";
    } else if (opcion === "B") {
        reaccion = "¡Y menos mal! Porque Maggie no iba a dejar pasar esa apuesta. 🍟";
    } else {
        reaccion = "Por fin reconocés tus errores, señor Rulings. JAJAJA. ♡";
    }

    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">🏆</div>
        <h1>Victoria de Maggie</h1>

        <div class="subtitulo">
            ${reaccion}
            <br><br>
            La apuesta estaba perdida:
            Maggie ganó y vos terminaste
            pagando el almuerzo.
            <br><br>
            <strong>Un McDonald's para la ganadora.</strong>
        </div>

       <button onclick="ArcadeRulings.iniciar()">
    🎮 Jugar: La deuda de Rulings
</button>
    `;
}

function final02() {
   desbloquearNivel(3);
Juego.celebrar();
 document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">💗</div>
        <h1>Y pensar que...</h1>

        <div class="subtitulo">
            Todo empezó con una juntada,
            una apuesta y un nombre
            que no pudiste recordar.
            <br><br>
            Quién iba a imaginar que esa
            pequeña anécdota terminaría
            siendo uno de nuestros recuerdos.
            <br><br>
            <em>Me alegra que aquella apuesta
            haya sido parte de nuestra historia.</em>
            <br><br>
            Te quiero, Rulings. ♡
        </div>

        <button onclick="menuNiveles()">
            Volver a nuestro universo 🌙
        </button>
    `;
}


function capitulo03() {
   Juego.mostrar(`
        <div class="corazon">🍔</div>
        <h1>03 — Siete meses</h1>
        <div class="subtitulo">
            Todo empezó con una apuesta...
            <br><br>
            Y una promesa que, por suerte,
            terminaste cumpliendo.
            <br><br>
            ¿Te acordás de nuestro primer almuerzo?
        </div>
        <button onclick="almuerzo03()">
            Recordarlo ♡
        </button>
    `);
}

function almuerzo03() {
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">🍟</div>
        <h1>Una cita inesperada</h1>
        <div class="subtitulo">
            Lo que comenzó como una apuesta
            terminó convirtiéndose en
            nuestro primer almuerzo juntos.
            <br><br>
            Tal vez ninguno imaginaba
            lo importante que sería
            ese pequeño momento.
            <br><br>
            Pero nuestra historia
            apenas estaba empezando...
        </div>
        <button onclick="reserva03()">
            Continuar ♡
        </button>
    `;
}

function reserva03() {
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">🌿</div>
        <h1>Un lugar especial</h1>
        <div class="subtitulo">
            Después de aquel primer almuerzo,
            hubo un lugar que terminó
            siendo parte de nuestra historia.
            <br><br>
            ¿Dónde fue nuestro primer beso?
        </div>
        <div class="opciones">
            <button onclick="respuesta03(false)">
                En una plaza
            </button>
            <button onclick="respuesta03(true)">
                En la Reserva Ecológica de Palermo
            </button>
            <button onclick="respuesta03(false)">
                En un restaurante
            </button>
        </div>
    `;
}

function respuesta03(correcta) {
    if (correcta) {
        document.querySelector(".contenedor").innerHTML = `
            <div class="corazon">💗</div>
            <h1>¡Recuerdo desbloqueado!</h1>
            <div class="subtitulo">
                ¡Te acordaste! ♡
                <br><br>
                La Reserva Ecológica de Palermo.
                <br><br>
                El lugar donde nos dimos
                nuestro primer beso.
                <br><br>
                Uno de esos recuerdos
                que siempre voy a guardar.
            </div>
            <button onclick="LaberintoAmor.iniciar()">
    🌿 Encontrar el camino ♡
</button>
        `;
    } else {
        document.querySelector(".contenedor").innerHTML = `
            <div class="corazon">😭</div>
            <h1>¡Rulings!</h1>
            <div class="subtitulo">
                ¿Otra vez problemas
                con la memoria?
                <br><br>
                JAJAJA, no puede ser.
                <br><br>
                Te doy otra oportunidad,
                pero esta vez pensalo bien. ♡
            </div>
            <button onclick="reserva03()">
                Intentar otra vez
            </button>
        `;
    }
}

function final03() {
  desbloquearNivel(4);
Juego.celebrar();
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">♡</div>
        <h1>Y acá estamos...</h1>
        <div class="subtitulo">
            Desde aquella apuesta,
            aquel almuerzo y nuestro
            primer beso...
            <br><br>
            Hasta todos los momentos
            que vinieron después.
            <br><br>
            Si pudiera volver a ese día,
            elegiría vivirlo otra vez.
            <br><br>
            Porque me gusta pensar
            que todavía nos quedan
            muchísimos recuerdos por crear.
            <br><br>
            <em>Con amor, Maggie. ♡</em>
        </div>
        <button onclick="menuNiveles()">
            Volver a nuestro universo 🌙
        </button>
    `;
}



function capitulo04() {
   Juego.mostrar(`
        <div class="corazon">🔐</div>
        <h1>El último secreto</h1>

        <div class="subtitulo">
            Llegaste hasta acá...
            <br><br>
            Después de recordar nuestra apuesta,
            aquel almuerzo y nuestro primer beso,
            todavía queda algo por descubrir.
            <br><br>
            No es una pregunta.
            No hay respuestas correctas.
            <br><br>
            Esta vez, solo quiero que leas.
        </div>

        <button onclick="ConstelacionAmor.iniciar()">
    ✨ Descubrir nuestra constelación
</button>
  `);
}

function abrirCarta04() {
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">💌</div>
        <h1>Para vos, Rulings</h1>

        <div class="subtitulo">
            No sé en qué momento exacto
            empezaste a convertirte en alguien
            tan importante para mí.
            <br><br>
            Quizás fue aquella noche
            en la que hablamos de cualquier cosa.
            O cuando te olvidaste de mi nombre
            y terminaste debiéndome un almuerzo.
            <br><br>
            Lo que sí sé es que me alegra
            muchísimo haberte conocido.
            <br><br>
            Me gustan nuestros recuerdos,
            nuestras conversaciones y hasta
            esas pequeñas tonterías que
            solamente nosotros entendemos.
            <br><br>
            Gracias por formar parte
            de mi vida y por todos
            los momentos que compartimos.
            <br><br>
            Y aunque este jueguito llegue
            a su final, espero que nosotros
            sigamos escribiendo nuestra historia.
            <br><br>
            <em>Con mucho amor, Maggie. ♡</em>
        </div>

        <button onclick="finalJuego()">
            Continuar ♡
        </button>
    `;
}

function finalJuego() {
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">💗</div>
        <h1>Maggie & Rulings</h1>

        <div class="subtitulo">
            Una apuesta.
            <br>
            Un almuerzo.
            <br>
            Un primer beso.
            <br><br>
            Y una historia que
            todavía tiene mucho por contar.
            <br><br>
            ♡ Gracias por jugar ♡
        </div>

        <button onclick="menuNiveles()">
            Volver a nuestros recuerdos
        </button>

        <div class="pequeno">
            Hecho con amor, especialmente para vos.
        </div>
    `;
}


function reiniciarJuego() {
    if (confirm("¿Querés borrar el progreso y comenzar desde cero?")) {
        localStorage.removeItem("nivelDesbloqueado");
        localStorage.removeItem("instruccionesVistas");
        location.reload();
    }
}

</script>

</body>

</html>
