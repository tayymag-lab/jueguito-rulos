<script>


function comenzar() {
    if (localStorage.getItem("instruccionesVistas") === "si") {
        menuNiveles();
        return;
    }

    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">🦋</div>
        <h1>Antes de comenzar...</h1>

        <div class="subtitulo">
            Bienvenido a nuestro pequeño universo.
            <br><br>
            ♡ Cada capítulo guarda un recuerdo.
            <br><br>
            ♡ Tenes que completar los niveles
            en orden para desbloquear los siguientes.
            <br><br>
            ♡ Algunas decisiones pondrán a prueba
            tu memoria.
            <br><br>
            ♡ Tu progreso se guardará automáticamente
            en este dispositivo y navegador.
            <br><br>
            Y lo más importante...
            disfrutá de nuestra historia. ♡
        </div>

        <button onclick="terminarInstrucciones()">
            Entendido, ¡a jugar! 
        </button>
    `;
}

function terminarInstrucciones() {
    localStorage.setItem("instruccionesVistas", "si");
    menuNiveles();
}


function menuNiveles() {
    let nivel = Number(localStorage.getItem("nivelDesbloqueado") || 1);
    nivel = Math.min(4, Math.max(1, nivel));

    function boton(numero, nombre, funcion) {
        if (nivel >= numero) {
            return `
                <button onclick="${funcion}()">
                    ♡ 0${numero} — ${nombre}
                </button>
            `;
        }

        return `
            <button disabled style="
                opacity: 0.35;
                cursor: not-allowed;
                border-color: #765665;
            ">
                🔒 0${numero} — ${nombre}
            </button>
        `;
    }

    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">💐</div>
        <h1>Nuestro universo</h1>

        <div class="subtitulo">
            Cada recuerdo guarda una parte
            de nuestra historia.
            <br><br>
            Completá los capítulos para
            descubrir lo que viene después...
        </div>

        <div class="opciones">
            
${boton(1, "El inicio", "escenaAnioNuevo")}

            ${boton(2, "Nuestra apuesta", "capitulo02")}
            ${boton(3, "Primera cita", "capitulo03")}
            ${boton(4, "Un regalo para vos", "capitulo04")}
        </div>

        <div class="pequeno">
            Progreso: ${nivel} de 4 capítulos disponibles 
        </div>

<button onclick="reiniciarJuego()"
    style="margin-top:20px; font-size:12px; opacity:0.5;">
    Reiniciar progreso
</button>
    `;
}

function desbloquearNivel(numero) {
    let actual = Number(localStorage.getItem("nivelDesbloqueado") || 1);

    if (numero > actual) {
        localStorage.setItem("nivelDesbloqueado", String(numero));
    }
}


function escenaAnioNuevo() {

    NovelaVisual.iniciar([

            personaje: "Lio",

        },

        {
            personaje: "Maggie",
            texto: "Interesante fue cuando te dije mi nombre y aposté a que no te lo ibas a acordar."
        },

], decisionAnioNuevo);

/* Reacción según la respuesta */

function resultado02(opcion) {
    let dialogos = [];

    if (opcion === "A") {
        dialogos = [
            {
                personaje: "Lio",
                texto: "Mi memoria decidió abandonarme en el peor momento."
            },
            {
                personaje: "Maggie",
                texto: "JAJAJA. Justo cuando tenías que acordarte UNA sola cosa."
            }
        ];
    } else if (opcion === "B") {
        dialogos = [
            {
                personaje: "Lio",
                texto: "Bueno, ¡pero al menos pagué el McDonald's!"
            },
            {
                personaje: "Maggie",
                texto: "Y menos mal. Porque esa hamburguesa me la había ganado."
            }
        ];
    } else {
        dialogos = [
            {
                personaje: "Lio",
                texto: "No tengo defensa posible..."
            },
            {
                personaje: "Maggie",
                texto: "Por fin reconoció sus errores, señorito. JAJAJA."
            }
        ];
    }

    dialogos.push(
        {
            personaje: "Maggie",
            texto: "Bueno, basta de excusas. Tenemos una deuda pendiente."
        },
        {
            personaje: "Lio",
            texto: "¿Y ahora qué tengo que hacer?"
        },
        {
            personaje: "Maggie",
            texto: "¡Conseguirme mi Mac, obviamente! 🍟"
        }
    );

    NovelaVisual.iniciar(dialogos, iniciarDeuda02);
}
