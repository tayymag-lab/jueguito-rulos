<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para nosotros ♡</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at top, #3a1828, transparent 45%),
        linear-gradient(145deg, #12090e, #29121d, #0d070a);

    color: #fff;

    font-family: Georgia, serif;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.contenedor {

    width: 90%;
    max-width: 500px;

    text-align: center;

    animation: aparecer 1s ease;
}

.corazon {

    font-size: 55px;

    margin-bottom: 20px;

    animation: latir 2s infinite;
}

h1 {

    font-size: 34px;

    font-weight: normal;

    letter-spacing: 2px;

    margin: 0 0 20px;
}

.subtitulo {

    font-size: 17px;

    line-height: 1.7;

    color: #eadde2;
}

.opciones {

    display: flex;

    flex-direction: column;

    gap: 12px;

    margin-top: 30px;
}

button {

    width: 100%;

    padding: 15px 20px;

    border: 1px solid #c9889d;

    border-radius: 30px;

    background: rgba(255,255,255,0.03);

    color: white;

    font-size: 16px;

    font-family: Georgia, serif;

    transition: 0.3s;
}

button:hover {

    background: #c9889d;

    color: #210d15;

    transform: translateY(-2px);
}

.pequeno {

    margin-top: 25px;

    font-size: 13px;

    opacity: 0.55;
}

@keyframes aparecer {

    from {

        opacity: 0;

        transform: translateY(25px);

    }

    to {

        opacity: 1;

        transform: translateY(0);

    }
}

@keyframes latir {

    0%, 100% {

        transform: scale(1);

    }

    50% {

        transform: scale(1.12);

    }
}

</style>

</head>

<body>

<div class="contenedor">

    <div class="corazon">♡</div>

    <h1>Para nosotros</h1>

    <div class="subtitulo">

        Una pequeña historia que solamente
        nosotros dos conocemos.

    </div>

    <button onclick="comenzar()">

        Comenzar ♡

    </button>

</div>


<script>

function comenzar() {

    document.querySelector(".contenedor").innerHTML = `

        <div class="corazon">💌</div>

        <h1>01 — Nosotros</h1>

        <div class="subtitulo">

            Antes de seguir...

            <br><br>

            quiero volver al principio.

            <br><br>

            Hay algo que quiero saber de vos.

        </div>

        <button onclick="pregunta1()">

            Continuar ♡

        </button>

    `;

}


function pregunta1() {

    document.querySelector(".contenedor").innerHTML = `

        <div class="corazon">💭</div>

        <h1>El comienzo</h1>

        <div class="subtitulo">

            Cuando nos conocimos...

            <br><br>

            <strong>
            ¿Qué fue lo primero que pensaste de mí?
            </strong>

        </div>

        <div class="opciones">

            <button onclick="respuesta('A')">
                Me llamó la atención
            </button>

            <button onclick="respuesta('B')">
                Me pareció interesante
            </button>

            <button onclick="respuesta('C')">
                No pensé demasiado
            </button>

            <button onclick="respuesta('D')">
                No sabía que iba a terminar así
            </button>

        </div>

        <div class="pequeno">
            Elegí la respuesta que más se parezca a vos ♡
        </div>

    `;

}


function respuesta(opcion) {

    let mensaje = "";

    if (opcion === "A") {

        mensaje = `
            Entonces hubo algo desde el principio... ♡
        `;

    }

    if (opcion === "B") {

        mensaje = `
            Quizás todavía no lo sabías,
            pero algo había empezado. ♡
        `;

    }

    if (opcion === "C") {

        mensaje = `
            Y miranos ahora...
            quién iba a imaginarlo. ♡
        `;

    }

    if (opcion === "D") {

        mensaje = `
            Tal vez esa sea justamente
            la parte más linda de nuestra historia. ♡
        `;

    }


    document.querySelector(".contenedor").innerHTML = `

        <div class="corazon">♡</div>

        <h1>Tu respuesta</h1>

        <div class="subtitulo">

            ${mensaje}

            <br><br>

            <span style="opacity:0.7">
            Pero esto recién empieza...
            </span>

        </div>

        <button onclick="pregunta2()">

            Siguiente ♡

        </button>

    `;

}


function pregunta2() {

    document.querySelector(".contenedor").innerHTML = `

        <div class="corazon">🌙</div>

        <h1>01.02</h1>

        <div class="subtitulo">

            Después de conocernos...

            <br><br>

            <strong>
            ¿En qué momento sentiste que
            empezaba a gustarte de verdad?
            </strong>

        </div>

        <div class="opciones">

            <button onclick="finalPregunta()">
                Desde el principio ♡
            </button>

            <button onclick="finalPregunta()">
                Después de hablar más
            </button>

            <button onclick="finalPregunta()">
                En algún momento inesperado
            </button>

            <button onclick="finalPregunta()">
                Todavía estoy intentando descubrirlo
            </button>

        </div>

    `;

}


function finalPregunta() {

    document.querySelector(".contenedor").innerHTML = `

        <div class="corazon">💗</div>

        <h1>Seguimos...</h1>

        <div class="subtitulo">

            Cada respuesta nos acerca
            un poquito más al final.

            <br><br>

            Y todavía quedan muchas
            cosas por descubrir.

        </div>

        <button onclick="alert('El próximo nivel está por venir ♡')">

            Continuar

        </button>

    `;

}

</script>

</body>

</html>
