<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> ♡Nuestro comienzo♡ </title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at top, #3a1828, transparent 45%),
        linear-gradient(145deg, #12090e, #29121d, #0d070a);

    color: #fff;

    font-family: Georgia, serif;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.contenedor {

    width: 90%;
    max-width: 500px;

    text-align: center;

    animation: aparecer 1s ease;
}

.corazon {

    font-size: 55px;

    margin-bottom: 20px;

    animation: latir 2s infinite;
}

h1 {

    font-size: 34px;

    font-weight: normal;

    letter-spacing: 2px;

    margin: 0 0 20px;
}

.subtitulo {

    font-size: 17px;

    line-height: 1.7;

    color: #eadde2;
}

.opciones {

    display: flex;

    flex-direction: column;

    gap: 12px;

    margin-top: 30px;
}

button {

    width: 100%;

    padding: 15px 20px;

    border: 1px solid #c9889d;

    border-radius: 30px;

    background: rgba(255,255,255,0.03);

    color: white;

    font-size: 16px;

    font-family: Georgia, serif;

    transition: 0.3s;
}

button:hover {

    background: #c9889d;

    color: #210d15;

    transform: translateY(-2px);
}

.pequeno {

    margin-top: 25px;

    font-size: 13px;

    opacity: 0.55;
}

@keyframes aparecer {

    from {

        opacity: 0;

        transform: translateY(25px);

    }

    to {

        opacity: 1;

        transform: translateY(0);

    }
}

@keyframes latir {

    0%, 100% {

        transform: scale(1);

    }

    50% {

        transform: scale(1.12);

    }
}

</style>

</head>

<body>

<div class="contenedor">

    <div class="corazon">♡</div>

    <h1>Vos y yo</h1>

    <div class="subtitulo">

        El inicio de nuestra historia, una que solamente
        nosotros dos conocemos.

    </div>

    <button onclick="comenzar()">

        ♡ Comenzar ♡

    </button>

</div>


<script>

function menuNiveles() {
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">🌙</div>

        <h1>Nuestro universo</h1>

        <div class="subtitulo">
            Cada recuerdo guarda una parte
            de nuestra historia.
            <br><br>
            ¿Qué capítulo querés descubrir?
        </div>

        <div class="opciones">
            <button onclick="pregunta1()">
                ♡ 01 — El comienzo
            </button>

  <button onclick="capitulo02()">
    ♡ 02 — Nuestra apuesta
</button>

            <button onclick="capitulo03()">
    ♡ 03 — Siete meses
</button>

          <button onclick="capitulo04()">
    ♡ 04 — Una carta para vos
</button>
        </div>

        <div class="pequeno">
            Maggie × Rulitos · Una historia nuestra
        </div>
    `;
}

function comenzar() {

    document.querySelector(".contenedor").innerHTML = `

        <div class="corazon">💌</div>

        <h1>01 — Nosotros</h1>

        <div class="subtitulo">

            Antes de seguir...

            <br><br>

            quiero volver al principio.

            <br><br>

            Hay algo que quiero saber de vos... 

        </div>

        <button onclick="pregunta1()">

            ♡ Continuar ♡

        </button>

    `;

}


function pregunta1() {

    document.querySelector(".contenedor").innerHTML = `

        <div class="corazon">💭</div>

        <h1>El comienzo</h1>

        <div class="subtitulo">

            Cuando nos conocimos...

            <br><br>

            <strong>
            ¿Qué fue lo primero que pensaste de mí?
            </strong>

        </div>

        <div class="opciones">

            <button onclick="respuesta('A')">
                "Me llamó la atención"
            </button>

            <button onclick="respuesta('B')">
                "Me pareció interesante"
            </button>

            <button onclick="respuesta('C')">
                "No pensé demasiado"
            </button>

            <button onclick="respuesta('D')">
                "No sabía que iba a terminar así..."
            </button>

        </div>

        <div class="pequeno">
            Elegí la respuesta que más se parezca a vos 
        </div>

    `;

}


function respuesta(opcion) {

    let mensaje = "";

    if (opcion === "A") {

        mensaje = `
            Entonces desde el principio hubo química... 
        `;

    }

    if (opcion === "B") {

        mensaje = `
            Capaz todavía no lo sabías,
            pero algo estaba empezado... 
        `;

    }

    if (opcion === "C") {

        mensaje = `
            Y miranos ahora...
            quién iba a imaginarlo, ¿no? 
        `;

    }

    if (opcion === "D") {

        mensaje = `
            Tal vez esa sea justamente
            la parte más linda de nuestra historia. ♡
        `;

    }


    document.querySelector(".contenedor").innerHTML = `

        <div class="corazon">♡</div>

        <h1>Tu respuesta</h1>

        <div class="subtitulo">

            ${mensaje}

            <br><br>

            <span style="opacity:0.7">
            Pero esto recién empieza...
            </span>

        </div>

        <button onclick="pregunta2()">

           ♡ Siguiente ♡

        </button>

    `;

}


function pregunta2() {

    document.querySelector(".contenedor").innerHTML = `

        <div class="corazon">🌙</div>

        <h1>01.02</h1>

        <div class="subtitulo">

            Después de conocernos... 

            <br><br>

            <strong>
            ¿En qué momento sentiste que
            empezaba a gustarte de verdad?
            </strong>

        </div>

        <div class="opciones">

            <button onclick="finalPregunta()">
                "Desde el principio."
            </button>

            <button onclick="finalPregunta()">
                "Después de hablar más."
            </button>

            <button onclick="finalPregunta()">
                "En algun momento inesperado..."
            </button>

            <button onclick="finalPregunta()">
                "Todavía estoy intentando descubrirlo..."
            </button>

        </div>

    `;

}


function finalPregunta() {

    document.querySelector(".contenedor").innerHTML = `

        <div class="corazon">💗</div>

        <h1>Seguimos...</h1>

        <div class="subtitulo">

            Cada respuesta nos acerca
            un poquitito más al final.

            <br><br>

            Y todavía quedan muchas
            cosas por descubrir.

        </div>

<button onclick="menuNiveles()">
    ♡ Primeros recuerdos ♡
</button>

    `;

}

function capitulo02() {
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">🎮</div>
        <h1>La apuesta</h1>

        <div class="subtitulo">
            MISIÓN 02 · RECUERDOS
            <br><br>
            Todo comenzó en una juntada...
            <br><br>
            Hablamos un poquito y, al final,
            decidí poner a prueba
            tu memoria.
            <br><br>
            ¿Estabas preparado para ese desafío?
        </div>

        <button onclick="apuesta02()">Aceptar la misión</button>
        <div class="pequeno">Maggie × Rulitos</div>
    `;
}

function apuesta02() {
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">🍟</div>
        <h1>El trato</h1>

        <div class="subtitulo">
          Yo te dije mi nombre y después
            solte una apuesta:
            <br><br>
            <em>«Mañana ni te vas a acordar
            mi nombre».</em>
            <br><br>
            Y vos, orgulloso, aceptaste esa apuesta... 
            El premio sería un McDonald's.
            <br><br>
            Y así, quedó sellado ese trato.
        </div>

        <button onclick="prueba02()">Descubrir el resultado</button>
    `;
}

function prueba02() {
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">👀</div>
        <h1>Dos días después...</h1>

        <div class="subtitulo">
            Nos volvimos a ver y
            te pregunte mi nombre...
            <br><br>
            Y llegó el momento de demostrar
            que tenías una memoria impecable.
            <br><br>
            Bueno... impecable no tanto.
            <br><br>
            <strong>¡No te acordaste y encima
            dijiste otro nombre!</strong>
        </div>

        <div class="opciones">
            <button onclick="resultado02('A')">
                Mi memoria me abandonó 😭
            </button>

            <button onclick="resultado02('B')">
                ¡Pero pagué el McDonald's! 🍔
            </button>

            <button onclick="resultado02('C')">
                No hay defensa posible...
            </button>
        </div>
    `;
}

function resultado02(opcion) {
    let reaccion = "";

    if (opcion === "A") {
        reaccion = "JAJAJA, tu memoria decidió tomarse el día libre. 😭";
    } else if (opcion === "B") {
        reaccion = "¡Y menos mal! Porque Maggie no iba a dejar pasar esa apuesta. 🍟";
    } else {
        reaccion = "Por fin reconocés tus errores, señor Rulings. JAJAJA. ♡";
    }

    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">🏆</div>
        <h1>Victoria de Maggie</h1>

        <div class="subtitulo">
            ${reaccion}
            <br><br>
            La apuesta estaba perdida:
            Maggie ganó y vos terminaste
            pagando el almuerzo.
            <br><br>
            <strong>Un McDonald's para la ganadora.</strong>
        </div>

        <button onclick="final02()">Cobrar recompensa ♡</button>
    `;
}

function final02() {
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">💗</div>
        <h1>Y pensar que...</h1>

        <div class="subtitulo">
            Todo empezó con una juntada,
            una apuesta y un nombre
            que no pudiste recordar.
            <br><br>
            Quién iba a imaginar que esa
            pequeña anécdota terminaría
            siendo uno de nuestros recuerdos.
            <br><br>
            <em>Me alegra que aquella apuesta
            haya sido parte de nuestra historia.</em>
            <br><br>
            Te quiero, Rulings. ♡
        </div>

        <button onclick="menuNiveles()">
            Volver a nuestro universo 🌙
        </button>
    `;
}


function capitulo03() {
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">🍔</div>
        <h1>03 — Siete meses</h1>
        <div class="subtitulo">
            Todo empezó con una apuesta...
            <br><br>
            Y una promesa que, por suerte,
            terminaste cumpliendo.
            <br><br>
            ¿Te acordás de nuestro primer almuerzo?
        </div>
        <button onclick="almuerzo03()">
            Recordarlo ♡
        </button>
    `;
}

function almuerzo03() {
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">🍟</div>
        <h1>Una cita inesperada</h1>
        <div class="subtitulo">
            Lo que comenzó como una apuesta
            terminó convirtiéndose en
            nuestro primer almuerzo juntos.
            <br><br>
            Tal vez ninguno imaginaba
            lo importante que sería
            ese pequeño momento.
            <br><br>
            Pero nuestra historia
            apenas estaba empezando...
        </div>
        <button onclick="reserva03()">
            Continuar ♡
        </button>
    `;
}

function reserva03() {
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">🌿</div>
        <h1>Un lugar especial</h1>
        <div class="subtitulo">
            Después de aquel primer almuerzo,
            hubo un lugar que terminó
            siendo parte de nuestra historia.
            <br><br>
            ¿Dónde fue nuestro primer beso?
        </div>
        <div class="opciones">
            <button onclick="respuesta03(false)">
                En una plaza
            </button>
            <button onclick="respuesta03(true)">
                En la Reserva Ecológica de Palermo
            </button>
            <button onclick="respuesta03(false)">
                En un restaurante
            </button>
        </div>
    `;
}

function respuesta03(correcta) {
    if (correcta) {
        document.querySelector(".contenedor").innerHTML = `
            <div class="corazon">💗</div>
            <h1>¡Recuerdo desbloqueado!</h1>
            <div class="subtitulo">
                ¡Te acordaste! ♡
                <br><br>
                La Reserva Ecológica de Palermo.
                <br><br>
                El lugar donde nos dimos
                nuestro primer beso.
                <br><br>
                Uno de esos recuerdos
                que siempre voy a guardar.
            </div>
            <button onclick="final03()">
                Continuar ♡
            </button>
        `;
    } else {
        document.querySelector(".contenedor").innerHTML = `
            <div class="corazon">😭</div>
            <h1>¡Rulings!</h1>
            <div class="subtitulo">
                ¿Otra vez problemas
                con la memoria?
                <br><br>
                JAJAJA, no puede ser.
                <br><br>
                Te doy otra oportunidad,
                pero esta vez pensalo bien. ♡
            </div>
            <button onclick="reserva03()">
                Intentar otra vez
            </button>
        `;
    }
}

function final03() {
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">♡</div>
        <h1>Y acá estamos...</h1>
        <div class="subtitulo">
            Desde aquella apuesta,
            aquel almuerzo y nuestro
            primer beso...
            <br><br>
            Hasta todos los momentos
            que vinieron después.
            <br><br>
            Si pudiera volver a ese día,
            elegiría vivirlo otra vez.
            <br><br>
            Porque me gusta pensar
            que todavía nos quedan
            muchísimos recuerdos por crear.
            <br><br>
            <em>Con amor, Maggie. ♡</em>
        </div>
        <button onclick="menuNiveles()">
            Volver a nuestro universo 🌙
        </button>
    `;
}



function capitulo04() {
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">🔐</div>
        <h1>El último secreto</h1>

        <div class="subtitulo">
            Llegaste hasta acá...
            <br><br>
            Después de recordar nuestra apuesta,
            aquel almuerzo y nuestro primer beso,
            todavía queda algo por descubrir.
            <br><br>
            No es una pregunta.
            No hay respuestas correctas.
            <br><br>
            Esta vez, solo quiero que leas.
        </div>

        <button onclick="abrirCarta04()">
            Abrir el último regalo ♡
        </button>
    `;
}

function abrirCarta04() {
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">💌</div>
        <h1>Para vos, Rulings</h1>

        <div class="subtitulo">
            No sé en qué momento exacto
            empezaste a convertirte en alguien
            tan importante para mí.
            <br><br>
            Quizás fue aquella noche
            en la que hablamos de cualquier cosa.
            O cuando te olvidaste de mi nombre
            y terminaste debiéndome un almuerzo.
            <br><br>
            Lo que sí sé es que me alegra
            muchísimo haberte conocido.
            <br><br>
            Me gustan nuestros recuerdos,
            nuestras conversaciones y hasta
            esas pequeñas tonterías que
            solamente nosotros entendemos.
            <br><br>
            Gracias por formar parte
            de mi vida y por todos
            los momentos que compartimos.
            <br><br>
            Y aunque este jueguito llegue
            a su final, espero que nosotros
            sigamos escribiendo nuestra historia.
            <br><br>
            <em>Con mucho amor, Maggie. ♡</em>
        </div>

        <button onclick="finalJuego()">
            Continuar ♡
        </button>
    `;
}

function finalJuego() {
    document.querySelector(".contenedor").innerHTML = `
        <div class="corazon">💗</div>
        <h1>Maggie & Rulings</h1>

        <div class="subtitulo">
            Una apuesta.
            <br>
            Un almuerzo.
            <br>
            Un primer beso.
            <br><br>
            Y una historia que
            todavía tiene mucho por contar.
            <br><br>
            ♡ Gracias por jugar ♡
        </div>

        <button onclick="menuNiveles()">
            Volver a nuestros recuerdos
        </button>

        <div class="pequeno">
            Hecho con amor, especialmente para vos.
        </div>
    `;
}


</script>

</body>

</html>
