<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Para nosotros ♡</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8edf2;
      font-family: Arial, sans-serif;
      color: #4a303b;
      text-align: center;
    }

    .pantalla {
      width: 90%;
      max-width: 500px;
      padding: 30px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    button {
      margin-top: 25px;
      padding: 14px 28px;
      border: none;
      border-radius: 25px;
      background: #b85c7a;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body>

  <div class="pantalla">

    <h1>♡ Para nosotros ♡</h1>

    <p>
      Tengo algo preparado para vos...
    </p>

    <button onclick="comenzar()">
      Comenzar
    </button>

  </div>

  <script>
    function comenzar() {
      alert("Nuestro juego comienza acá ♡");
    }
  </script>

</body>
</html>
